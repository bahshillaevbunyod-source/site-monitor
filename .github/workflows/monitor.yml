name: Monitor

on:
  schedule:
    - cron: '7 * * * *'   # каждый час в :07 (не в :00, в начале часа у GitHub самая большая очередь)
  workflow_dispatch:       # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write          # нужно, чтобы сохранить state.json обратно в репозиторий

concurrency:
  group: monitor           # два запуска одновременно не идут, чтобы не затереть state.json
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверка сайтов
        run: node monitor.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Сохранить state.json, если изменился
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: update"
            git push
          else
            echo "state.json не изменился"
          fi
